<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Luz Digital - Agencia de Marketing Digital especializada en Marketing Médico.">

    <meta name="author" content="Luz Digital">

    <title>Luz Digital | Marketing Digital</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #222222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            padding: 60px 20px;
        }

        .logo {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .logo span {
            color: #6c2bd9;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            color: #666666;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #6c2bd9;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .button:hover {
            background: #5420ad;
        }

        footer {
            margin-top: 60px;
            font-size: 14px;
            color: #999999;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            Luz <span>Digital</span>
        </div>

        <h1>
            Marketing Digital que impulsa tu crecimiento
        </h1>

        <p>
            Somos una agencia especializada en marketing digital,
            publicidad y estrategias de crecimiento para profesionales
            y empresas.
        </p>

        <a href="#" class="button">
            Conoce nuestros servicios
        </a>

        <footer>
            © 2026 Luz Digital. Todos los derechos reservados.
        </footer>

    </main>

</body>
</html>
